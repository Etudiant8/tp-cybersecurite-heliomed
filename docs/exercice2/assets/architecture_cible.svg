<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1200" height="780" fill="#f7f8fa"/>
  <text x="20" y="30" font-size="20" font-weight="800" fill="#0f2557">HelioMed — Architecture de sécurité cible (Étape 2.3)</text>
  <text x="20" y="50" font-size="12" fill="#64748b">Labo helio-lab — segmentation en 3 zones, IP réelles des VM (helio-frontal 10.10.10.10, helio-applicatif 10.10.10.20)</text>

  <!-- Internet -->
  <circle cx="80" cy="130" r="34" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="126" font-size="12" text-anchor="middle" fill="#334155" font-weight="700">Internet</text>
  <text x="80" y="140" font-size="10" text-anchor="middle" fill="#64748b">/ patients</text>

  <!-- Firewall périmétrique -->
  <rect x="170" y="100" width="110" height="60" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="225" y="124" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="800">Pare-feu</text>
  <text x="225" y="139" font-size="10" text-anchor="middle" fill="#7f1d1d">périmétrique</text>
  <text x="225" y="152" font-size="9" text-anchor="middle" fill="#94a3b8">(pfSense)</text>
  <text x="225" y="90" font-size="10" text-anchor="middle" fill="#b91c1c">443/tcp uniquement →</text>

  <path d="M114 130 L166 130" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- DMZ zone -->
  <rect x="320" y="70" width="260" height="180" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="335" y="90" font-size="12" font-weight="800" fill="#1d4ed8">ZONE DMZ FRONTALE</text>

  <rect x="345" y="105" width="210" height="120" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="126" font-size="12" text-anchor="middle" fill="#0f2557" font-weight="800">helio-frontal</text>
  <text x="450" y="140" font-size="10" text-anchor="middle" fill="#334155">10.10.10.10</text>
  <rect x="360" y="148" width="180" height="24" rx="4" fill="#dbeafe"/>
  <text x="450" y="164" font-size="9.5" text-anchor="middle" fill="#1d4ed8" font-weight="700">WAF (ModSecurity/Coraza)</text>
  <rect x="360" y="176" width="180" height="24" rx="4" fill="#dbeafe"/>
  <text x="450" y="192" font-size="9.5" text-anchor="middle" fill="#1d4ed8" font-weight="700">Reverse proxy Nginx — TLS 1.3</text>
  <text x="450" y="212" font-size="8.5" text-anchor="middle" fill="#64748b">cert TLS ici · logs → SIEM</text>

  <path d="M284 130 L341 130" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Firewall interne 1 -->
  <rect x="600" y="100" width="90" height="55" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="645" y="122" font-size="11" text-anchor="middle" fill="#b91c1c" font-weight="800">Pare-feu</text>
  <text x="645" y="136" font-size="10" text-anchor="middle" fill="#7f1d1d">interne #1</text>
  <text x="645" y="148" font-size="8" text-anchor="middle" fill="#94a3b8">3000/tcp seul.</text>

  <path d="M580 150 L596 128" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Zone applicative -->
  <rect x="750" y="70" width="260" height="180" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="765" y="90" font-size="12" font-weight="800" fill="#c2410c">ZONE APPLICATIVE</text>

  <rect x="775" y="105" width="210" height="120" rx="8" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="880" y="126" font-size="12" text-anchor="middle" fill="#7c2d12" font-weight="800">helio-applicatif</text>
  <text x="880" y="140" font-size="10" text-anchor="middle" fill="#334155">10.10.10.20</text>
  <rect x="790" y="148" width="180" height="24" rx="4" fill="#ffedd5"/>
  <text x="880" y="164" font-size="9.5" text-anchor="middle" fill="#c2410c" font-weight="700">Docker — appli patient (réseau app-net)</text>
  <text x="880" y="212" font-size="8.5" text-anchor="middle" fill="#64748b">chiffrement TLS interne · logs → SIEM</text>

  <path d="M690 128 L746 130" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Firewall interne 2 -->
  <rect x="880" y="255" width="90" height="55" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="925" y="277" font-size="11" text-anchor="middle" fill="#b91c1c" font-weight="800">Pare-feu</text>
  <text x="925" y="291" font-size="10" text-anchor="middle" fill="#7f1d1d">interne #2</text>
  <text x="925" y="303" font-size="8" text-anchor="middle" fill="#94a3b8">3306/tcp seul.</text>

  <path d="M880 225 L925 251" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Zone données -->
  <rect x="750" y="330" width="260" height="160" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="765" y="350" font-size="12" font-weight="800" fill="#b91c1c">ZONE DONNÉES</text>

  <rect x="775" y="365" width="210" height="105" rx="8" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="880" y="386" font-size="12" text-anchor="middle" fill="#7f1d1d" font-weight="800">BDD (conteneur MySQL)</text>
  <text x="880" y="400" font-size="10" text-anchor="middle" fill="#334155">helio-applicatif:3306 (interne, non exposé)</text>
  <rect x="790" y="408" width="180" height="24" rx="4" fill="#fee2e2"/>
  <text x="880" y="424" font-size="9.5" text-anchor="middle" fill="#b91c1c" font-weight="700">Chiffrement au repos (AES-256)</text>
  <text x="880" y="450" font-size="8.5" text-anchor="middle" fill="#64748b">réseau Docker "data-net" internal:true — 0 route sortante</text>
  <text x="880" y="463" font-size="8.5" text-anchor="middle" fill="#64748b">accessible uniquement du conteneur applicatif</text>

  <path d="M925 306 L925 361" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Sauvegardes -->
  <rect x="1030" y="365" width="130" height="60" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1095" y="388" font-size="11" text-anchor="middle" fill="#334155" font-weight="700">Sauvegardes</text>
  <text x="1095" y="402" font-size="9" text-anchor="middle" fill="#64748b">chiffrées, hors site</text>
  <text x="1095" y="414" font-size="9" text-anchor="middle" fill="#64748b">RPO ≤ 24h</text>
  <path d="M985 400 L1026 400" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- SIEM -->
  <rect x="420" y="550" width="360" height="90" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="600" y="575" font-size="13" text-anchor="middle" fill="#15803d" font-weight="800">SIEM — collecte de logs (Wazuh)</text>
  <text x="600" y="592" font-size="10" text-anchor="middle" fill="#166534">Journaux auth SSH, Nginx, applicatif, pare-feu — horodatage NTP synchronisé</text>
  <text x="600" y="608" font-size="10" text-anchor="middle" fill="#166534">Corrélation → alerte → Plan de réponse aux incidents (§2.5)</text>
  <text x="600" y="624" font-size="9" text-anchor="middle" fill="#4b8b62">Traite le risque « Repudiation » identifié en Ex.1 (STRIDE)</text>

  <path d="M450 225 L520 546" stroke="#15803d" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M880 225 L650 546" stroke="#15803d" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M880 470 L700 546" stroke="#15803d" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <path d="M225 160 L225 500 L420 585" stroke="#15803d" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="20" y="680" width="1160" height="85" rx="8" fill="#fff" stroke="#dfe3e9"/>
  <text x="35" y="700" font-size="11" font-weight="700" fill="#0f2557">Légende</text>
  <line x1="35" y1="715" x2="65" y2="715" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="72" y="719" font-size="9.5" fill="#334155">Flux applicatif autorisé (allow-list pare-feu)</text>
  <line x1="335" y1="715" x2="365" y2="715" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="372" y="719" font-size="9.5" fill="#334155">Flux de logs vers le SIEM</text>
  <rect x="600" y="708" width="16" height="14" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="622" y="719" font-size="9.5" fill="#334155">Emplacement d'un chiffrement (repos ou transit)</text>
  <text x="35" y="740" font-size="9.5" fill="#64748b">Écart avec l'état actuel (Ex.1) : la BDD est aujourd'hui colocalisée avec l'appli sans réseau Docker dédié ni pare-feu interne #2 — cible Ex.3.</text>
  <text x="35" y="753" font-size="9.5" fill="#64748b">Le canal frontal↔applicatif est aujourd'hui en HTTP clair (constaté Ex.1) — la cible impose TLS de bout en bout, y compris interne.</text>
</svg>
