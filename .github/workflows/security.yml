name: Security scan (DevSecOps — Ex.2)

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca-scan-repo:
    name: SCA scan (Trivy — filesystem/IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on repo (deps + misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          # Bloquant : ceci scanne NOTRE code (pas les images de démo), 0 trouvaille
          # actuellement (vérifié) -- c'est le vrai point de contrôle go/no-go build.
          exit-code: '1'

  sca-scan-images:
    name: SCA scan (Trivy — images applicatives du docker-compose)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - bkimminich/juice-shop:latest
          - vulnerables/web-dvwa:latest
          - mysql:5.7
    steps:
      - name: Run Trivy on ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ matrix.image }}
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'
